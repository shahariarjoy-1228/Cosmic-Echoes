<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Echoes audio demo</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui; background: #0e1425; color: #eaf0ff; }
    main { max-width: 54rem; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin: 1rem 0; border: 1px solid #66748f; border-radius: .6rem; padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; }
    label { display: grid; gap: .25rem; }
    input, select, button { font: inherit; min-height: 2.25rem; }
    button { margin: .25rem .25rem .25rem 0; }
    :focus-visible { outline: 2px solid #a7daff; outline-offset: 2px; }
    table { width: 100%; text-align: left; border-collapse: collapse; }
    td, th { padding: .25rem; border-bottom: 1px solid #596681; }
    #error { color: #ffb9b9; }
  </style>
  <script type="module" src="./audio-demo.js"></script>
</head>
<body>
<main>
  <h1>Cosmic Echoes audio demo</h1>
  <p>Generate a soundscape, then press Play to start audio.</p>
  <form id="composition">
    <fieldset>
      <legend>Composition</legend>
      <div class="grid">
        <label>Musical environment <select id="scale"></select></label>
        <label>Listening scenario <select id="scenario">
          <option value="full">Full cosmic soundscape</option>
          <option value="one">One root note</option>
          <option value="binary">Default binary tree</option>
          <option value="ternary">Maximum ternary tree</option>
          <option value="multiple">Two independent roots</option>
          <option value="melody">Melody only</option>
          <option value="ambient">Ambient harmony only</option>
        </select></label>
        <label>Recursion depth <input id="depth" type="number" min="0" max="4" step="1" value="3" required></label>
        <label>Children per star <input id="children" type="number" min="1" max="3" step="1" value="2" required></label>
        <label>Decay <input id="decay" type="number" min="0.35" max="0.85" step="0.01" value="0.65" required></label>
        <label>Spread (degrees) <input id="spread" type="number" min="30" max="180" step="1" value="100" required></label>
        <label>Base delay (seconds) <input id="delay" type="number" min="0.4" max="2" step="0.05" value="0.8" required></label>
        <label>Tempo (BPM) <input id="tempo" type="number" min="40" max="80" step="1" value="55" required></label>
        <label>Root X <input id="x" type="number" min="0" max="1" step="0.01" value="0.5" required></label>
        <label>Root Y <input id="y" type="number" min="0" max="1" step="0.01" value="0.5" required></label>
      </div>
      <button type="submit">Generate composition</button>
    </fieldset>
  </form>
  <fieldset>
    <legend>Playback and mix</legend>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="stop">Stop</button>
    <button id="replay">Replay</button>
    <div class="grid">
      <label>Master volume <input id="volume" type="range" min="0" max="1" step=".01" value="0.3"></label>
      <label>Reverb <input id="reverb" type="range" min="0" max="1" step=".01" value="0.2"></label>
      <label>Ambient harmony <input id="ambient" type="range" min="0" max="1" step=".01" value="0.55"></label>
      <label>Atmosphere <input id="atmosphere" type="range" min="0" max="1" step=".01" value="0.25"></label>
    </div>
  </fieldset>
  <p id="status" role="status">Audio is idle.</p>
  <p id="error" role="alert"></p>
  <p id="diagnostics"></p>
  <table>
    <caption>First 12 mapped notes</caption>
    <thead><tr><th scope="col">Note</th><th scope="col">Instrument</th><th scope="col">Onset (s)</th><th scope="col">Duration (s)</th></tr></thead>
    <tbody id="notes"></tbody>
  </table>
</main>
</body>
</html>
